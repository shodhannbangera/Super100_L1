<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    h2 {
      color: #4169e1;
    }

    /* Vertical Navigation Bar */
    .vertical-nav {
      width: 150px;
      background-color: lightblue;
      border: 1px solid black;
    }

    .vertical-nav a {
      display: block;
      color: blue;
      padding: 10px;
      text-decoration: none;
    }

    .vertical-nav a.home {
      background-color: orange;
      color: white;
      font-weight: bold;
    }

    .vertical-nav a:hover {
      background-color: #ddd;
    }

    /* Horizontal Navigation Bar */
    .horizontal-nav {
      display: flex;
      border: 1px solid black;
      background-color: lightgray;
      width: fit-content;
    }

    .horizontal-nav a {
      padding: 10px 20px;
      text-decoration: none;
      color: blue;
      border-right: 1px solid #ccc;
      text-align: center;
    }

    .horizontal-nav a.home {
      background-color: #555;
      color: white;
      font-weight: bold;
    }

    .horizontal-nav a:last-child {
      border-right: none;
    }

    .container {
      display: flex;
      gap: 50px;
      margin-top: 20px;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

  </style>
</head>
<body>

<h2>Task 2</h2>

<div class="container">

  <div class="section">
    <h4>Vertical Navigation Bar</h4>
    <div class="vertical-nav">
      <a href="#" class="home">Home</a>
      <a href="#">Java</a>
      <a href="#">CSS</a>
      <a href="#">HTML</a>
      <a href="#">Bootstrap</a>
    </div>
  </div>

  <div class="section">
    <h4>Horizontal Navigation Bar</h4>
    <div class="horizontal-nav">
      <a href="#" class="home">Home</a>
      <a href="#">Java</a>
      <a href="#">HTML</a>
      <a href="#">CSS</a>
    </div>
  </div>

</div>

</body>
</html>
